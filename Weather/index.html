<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My-Weather-App</title>

  <style>

    body {
        background-color: rgba(133, 166, 216, 0.574);
        display: flex;
        justify-content: center;
        margin-top: 100px;
      }

      .weather-data {
        background-color: cadetblue;
        padding: 50px;
        border-radius: 15px;
        text-align: center;
      }

      .weather-data h1 {
        text-decoration-line: underline;
        color: black;
        font-style: oblique;
      }

      input {
        padding: 15px;
        border-radius: 10px;
        border: none;
        width: 300px;
      }

      button {
        padding: 15px;
        border-radius: 10px;
        border: none;
        background-color: blue;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: rgb(1, 251, 101);
        color: black;
        transition: 1s;
      }

      #weather-result {
        margin-left: 30px;
        padding: 30px;
        background-color: white;
        border-radius: 15px;
        min-width: 250px;
      }

  </style>

</head>
<body>
    <div class="weather-data">
      <h1>My-Weather-App</h1>

      <form id="weather-form">
        <input
          type="text"
          id="city-input"
          placeholder="Enter Your City Name"
        />

        <button type="submit">Check Weather</button>
      </form>
    </div>

    <div id="weather-result">
      <h1 id="current-city-name"></h1>
      <h1 id="temp-display"></h1>
      <h1 id="disc-display"></h1>
    </div>

    <script src="script.js"></script>
  </body>
</html>
